name: Verify site
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-site.mjs
      - run: npm run build && node scripts/verify-site.mjs
        env:
          SITE_URL: https://raw-jpeg.test
      - run: npm run build && node scripts/verify-site.mjs
        env:
          SITE_URL: https://raw-jpeg.test
          CF_PAGES_BRANCH: preview-verification
